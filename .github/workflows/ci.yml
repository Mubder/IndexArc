name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: no job in this workflow writes to the repository.
permissions:
  contents: read

jobs:
  verify:
    name: Lint + Test + Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck (tsc --noEmit)
        run: npm run lint
      - name: Unit, integration, fuzz smoke and coverage gate
        run: npm run test:coverage
      - name: Dependency audit (high/critical gate)
        run: npm audit --audit-level=high

  bench:
    name: Performance budgets (10k entries)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Benchmark (fails if a budget is exceeded)
        run: npm run bench
        env:
          BENCH_OUT: bench-results.json
      - name: Publish timings
        if: always()
        run: |
          if [ -f bench-results.json ]; then
            node -e '
              const r = require("./bench-results.json");
              const rows = Object.keys(r.budgets).map((k) => {
                const v = r.ms[k];
                const ok = v !== undefined && v <= r.budgets[k];
                return "| " + k + " | " + (v ?? "n/a") + " | " + r.budgets[k] + " | " + (ok ? "ok" : "OVER") + " |";
              });
              console.log(["### Performance at " + r.entries + " entries (" + r.node + ")", "", "| Metric | ms | Budget | |", "|---|---|---|---|", ...rows].join("\n"));
            ' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bench-results
          path: bench-results.json
          if-no-files-found: ignore

  e2e:
    name: Electron end-to-end (set password, save, lock, restart, unlock)
    runs-on: windows-latest
    needs: verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build UI + server bundle
        run: npm run build
      - name: Playwright (Electron)
        run: npm run test:e2e
      - name: Upload trace on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-report
          path: |
            playwright-report
            test-results

  installer-preservation:
    name: Build + reinstall data-preservation proof
    runs-on: windows-latest
    needs: verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build UI + server bundle
        run: npm run build
      - name: Verify dist bundle completeness
        run: npm run check:dist
      - name: Build the standalone CLI
        run: npm run build:cli
      - name: Build Windows installer (portable + NSIS)
        run: npx electron-builder --win portable nsis --x64
        env:
          # CI has no signing identity; the artifacts remain unsigned (see
          # docs/RELEASE.md for the signing prerequisite).
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Install → write data → reinstall → assert data survived
        run: node scripts/test-installer-preservation.cjs
