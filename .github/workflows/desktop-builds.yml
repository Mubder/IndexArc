name: Desktop Build & Package CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ created ]

# Least privilege: builds only read the repository; artifacts are uploaded via
# the Actions artifact service, which does not need a contents:write token.
permissions:
  contents: read

jobs:
  build-cross-platform:
    name: Build Desktop app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # actions: read lets the SignPath connector download this run's artifacts.
    permissions:
      contents: read
      actions: read
    env:
      # Windows release builds are signed by whichever service is configured
      # (setup: docs/CODE_SIGNING.md); otherwise they stay unsigned.
      # 1st choice — Azure Trusted Signing (paid, publisher = your verified
      #   name): on once the repository variable AZURE_SIGNING_ENDPOINT is set.
      # 2nd choice — SignPath (free OSS signing, publisher = SignPath
      #   Foundation): on once SIGNPATH_ORGANIZATION_ID is set and Azure is not.
      SIGN_AZURE: ${{ matrix.os == 'windows-latest' && github.event_name == 'release' && vars.AZURE_SIGNING_ENDPOINT != '' }}
      SIGN_SIGNPATH: ${{ matrix.os == 'windows-latest' && github.event_name == 'release' && vars.AZURE_SIGNING_ENDPOINT == '' && vars.SIGNPATH_ORGANIZATION_ID != '' }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        include:
          - os: windows-latest
            build-script: desktop:win
          - os: macos-latest
            build-script: desktop:mac
          - os: ubuntu-latest
            build-script: desktop:linux

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install System Dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools rpm

      - name: Install Dependencies
        run: npm ci

      - name: Build and Package Desktop Binary
        if: env.SIGN_SIGNPATH != 'true' && env.SIGN_AZURE != 'true'
        run: npm run ${{ matrix.build-script }}
        env:
          # Avoid signing issues during CI on macOS unless certs are passed
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Signed Windows release (Azure Trusted Signing) ───────────────────
      # electron-builder signs during the normal build: the app exe, Electron's
      # DLLs, the installer, its uninstaller and the portable exe. It also
      # writes publisherName into app-update.yml, so installed builds verify
      # updates against it. forceCodeSigning makes a signing failure fail the
      # build instead of shipping unsigned files.
      - name: Build and sign (Azure Trusted Signing)
        if: env.SIGN_AZURE == 'true'
        shell: bash
        run: |
          npm run build && npm run check:dist && npm run build:cli
          node scripts/azure-sign-config.mjs electron-builder.azure.json
          npx electron-builder --config electron-builder.azure.json --win portable nsis --x64 --publish never
        env:
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          AZURE_SIGNING_PUBLISHER_NAME: ${{ vars.AZURE_SIGNING_PUBLISHER_NAME }}
          AZURE_SIGN_DLLS: ${{ vars.AZURE_SIGN_DLLS }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Verify signatures (Azure)
        if: env.SIGN_AZURE == 'true'
        shell: pwsh
        env:
          PUBLISHER: ${{ vars.AZURE_SIGNING_PUBLISHER_NAME }}
        run: |
          $files = @(Get-ChildItem dist-desktop -Filter 'IndexArc-*.exe') + @(Get-Item dist-desktop/win-unpacked/IndexArc.exe) + @(Get-Item dist-desktop/win-unpacked/resources/cli/indexarc.exe)
          $bad = $false
          foreach ($f in $files) {
            $s = Get-AuthenticodeSignature $f.FullName
            $cn = if ($s.SignerCertificate) { $s.SignerCertificate.GetNameInfo('SimpleName', $false) } else { '' }
            "{0}: {1} ({2})" -f $f.Name, $s.Status, $cn
            if ($s.Status -ne 'Valid' -or $cn -ne $env:PUBLISHER) { $bad = $true }
          }
          if ($bad) { throw "A Windows artifact is unsigned or signed by someone other than '$env:PUBLISHER'." }
          if (-not (Select-String -Quiet -Path dist-desktop/win-unpacked/resources/app-update.yml -Pattern 'publisherName')) { throw 'app-update.yml has no publisherName' }

      # ── Signed Windows release (SignPath) ────────────────────────────────
      # 1. Package the app unpacked and have SignPath sign IndexArc.exe.
      # 2. Build the installer and portable exe from the signed folder.
      # 3. Have SignPath sign those two, then refresh latest.yml and the
      #    blockmap, whose hashes the signature just changed.
      - name: Package unpacked app (to sign)
        if: env.SIGN_SIGNPATH == 'true'
        run: npm run build && npm run check:dist && npm run build:cli && npx electron-builder --win dir --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload unsigned app
        id: upload-unsigned-app
        if: env.SIGN_SIGNPATH == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signpath-input-app
          path: dist-desktop/win-unpacked/
          if-no-files-found: error
          retention-days: 1

      - name: Sign app (SignPath)
        if: env.SIGN_SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.upload-unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed/win-unpacked

      - name: Build installers from the signed app
        if: env.SIGN_SIGNPATH == 'true'
        shell: bash
        run: |
          node scripts/write-app-update-yml.mjs signed/win-unpacked "SignPath Foundation"
          npx electron-builder --win nsis portable --x64 --publish never --prepackaged signed/win-unpacked
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload unsigned installers
        id: upload-unsigned-installers
        if: env.SIGN_SIGNPATH == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signpath-input-installers
          path: |
            dist-desktop/IndexArc-Setup-*.exe
            dist-desktop/IndexArc-Portable-*.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign installers (SignPath)
        if: env.SIGN_SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: installers
          github-artifact-id: ${{ steps.upload-unsigned-installers.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed/installers

      - name: Use signed installers and refresh update manifest
        if: env.SIGN_SIGNPATH == 'true'
        shell: bash
        run: |
          cp -f signed/installers/IndexArc-Setup-*.exe signed/installers/IndexArc-Portable-*.exe dist-desktop/
          node scripts/refresh-update-manifest.mjs dist-desktop

      # CycloneDX SBOM of the production (runtime) dependency tree. Generated
      # once (on the Windows leg) since the npm tree is platform-independent.
      - name: Generate SBOM (CycloneDX)
        if: matrix.os == 'windows-latest'
        run: npx --yes @cyclonedx/cyclonedx-npm --omit dev --output-file sbom.cdx.json

      - name: Upload SBOM
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: IndexArc-SBOM
          path: sbom.cdx.json
          if-no-files-found: error

      - name: Locate and Upload Windows Artifacts
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: IndexArc-Windows-Builds
          path: |
            dist-desktop/IndexArc-Portable-*.exe
            dist-desktop/IndexArc-Setup-*.exe
            dist-desktop/IndexArc-Setup-*.exe.blockmap
            dist-desktop/latest.yml

      - name: Locate and Upload macOS Artifacts
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: IndexArc-macOS-Builds
          path: |
            dist-desktop/IndexArc-*-mac-*.dmg
            dist-desktop/IndexArc-*-mac-*.zip
            dist-desktop/latest-mac.yml

      - name: Locate and Upload Linux Artifacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: IndexArc-Linux-Builds
          path: |
            dist-desktop/IndexArc-*-linux-*.AppImage
            dist-desktop/IndexArc-*-linux-*.tar.gz
            dist-desktop/latest-linux.yml

  # Attach every build, the update manifests (latest*.yml, read by the
  # in-app updater) and the SBOM to the GitHub Release. Only this job gets
  # write access, and only for release events.
  publish-release:
    name: Attach artifacts to the release
    if: github.event_name == 'release'
    needs: build-cross-platform
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-assets
          # Only the finished builds and the SBOM, never the signpath-input-*
          # intermediates (unsigned files sent to SignPath).
          pattern: IndexArc-*
          merge-multiple: true

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          ls -la release-assets
          gh release upload "$TAG" release-assets/* --clobber --repo "${{ github.repository }}"
