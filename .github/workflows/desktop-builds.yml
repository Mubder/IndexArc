name: Desktop Build & Package CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ created ]

# Least privilege: builds only read the repository; artifacts are uploaded via
# the Actions artifact service, which does not need a contents:write token.
permissions:
  contents: read

jobs:
  build-cross-platform:
    name: Build Desktop app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        include:
          - os: windows-latest
            build-script: desktop:win
          - os: macos-latest
            build-script: desktop:mac
          - os: ubuntu-latest
            build-script: desktop:linux

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Install System Dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools rpm

      - name: Install Dependencies
        run: npm ci

      - name: Build and Package Desktop Binary
        run: npm run ${{ matrix.build-script }}
        env:
          # Avoid signing issues during CI on macOS unless certs are passed
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # CycloneDX SBOM of the production (runtime) dependency tree. Generated
      # once (on the Windows leg) since the npm tree is platform-independent.
      - name: Generate SBOM (CycloneDX)
        if: matrix.os == 'windows-latest'
        run: npx --yes @cyclonedx/cyclonedx-npm --omit dev --output-file sbom.cdx.json

      - name: Upload SBOM
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: IndexArc-SBOM
          path: sbom.cdx.json
          if-no-files-found: error

      - name: Locate and Upload Windows Artifacts
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: IndexArc-Windows-Builds
          path: |
            dist-desktop/IndexArc-Portable-*.exe
            dist-desktop/IndexArc-Setup-*.exe

      - name: Locate and Upload macOS Artifacts
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: IndexArc-macOS-Builds
          path: |
            dist-desktop/IndexArc-*-mac-*.dmg
            dist-desktop/IndexArc-*-mac-*.zip

      - name: Locate and Upload Linux Artifacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: IndexArc-Linux-Builds
          path: |
            dist-desktop/IndexArc-*-linux-*.AppImage
            dist-desktop/IndexArc-*-linux-*.tar.gz
