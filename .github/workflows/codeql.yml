name: CodeQL

# Static analysis (SAST) of the server, renderer, Electron shell and scripts
# (ASVS 10.1.1). Findings appear under Security → Code scanning. Runs on
# every push to main, every pull request, and weekly so new queries are
# applied to unchanged code too.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload the results to code scanning
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Initialize CodeQL
        uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: javascript-typescript
          # JS/TS is analysed from source: no build step needed.
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - node_modules
              - dist
              - coverage
              - "**/*.test.ts"
              - e2e
      - name: Analyze
        uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: "/language:javascript-typescript"
