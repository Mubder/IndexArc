name: CodeQL

# Static analysis (SAST) of the server, renderer, Electron shell and scripts
# (ASVS 10.1.1). Findings appear under Security → Code scanning. Runs on
# every push to main, every pull request, and weekly so new queries are
# applied to unchanged code too.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload the results to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          # JS/TS is analysed from source: no build step needed.
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - node_modules
              - dist
              - coverage
              - "**/*.test.ts"
              - e2e
      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:javascript-typescript"
